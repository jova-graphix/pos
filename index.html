<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#1F4736">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Till">
<meta name="description" content="Simple point-of-sale app with phone-camera barcode scanning.">
<title>Till — POS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/quagga/0.12.1/quagga.min.js"></script>
<style>
  :root{
    --paper:#F6F1E4;
    --paper-dim:#EDE6D3;
    --ink:#211E1A;
    --ink-soft:#5B564C;
    --forest:#1F4736;
    --forest-dark:#122A21;
    --amber:#D9A441;
    --amber-dark:#B9832E;
    --brick:#B23A2E;
    --line: rgba(33,30,26,0.14);
    --radius: 10px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--forest-dark);
    font-family:'IBM Plex Sans', sans-serif;
    color:var(--ink);
    -webkit-tap-highlight-color: transparent;
    overscroll-behavior-y: contain;
  }
  .mono{font-family:'Space Mono', monospace;}

  #app{
    max-width:480px;
    margin:0 auto;
    min-height:100vh;
    background:var(--paper);
    display:flex;
    flex-direction:column;
    position:relative;
  }

  /* ---- Header ---- */
  header{
    background:var(--forest);
    color:var(--paper);
    padding:calc(16px + env(safe-area-inset-top)) 18px 14px;
    position:relative;
    z-index:2;
  }
  .brand-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
  }
  .brand{
    display:flex;
    align-items:baseline;
    gap:8px;
  }
  .brand .mark{
    font-family:'Space Mono', monospace;
    font-weight:700;
    font-size:20px;
    letter-spacing:0.5px;
  }
  .brand .sub{
    font-size:11px;
    color:rgba(246,241,228,0.6);
    letter-spacing:1.5px;
    text-transform:uppercase;
  }
  .led{
    background:var(--forest-dark);
    border:1px solid rgba(246,241,228,0.15);
    border-radius:6px;
    padding:6px 10px;
    text-align:right;
    min-width:96px;
  }
  .led .lbl{
    font-size:9px;
    letter-spacing:1.5px;
    text-transform:uppercase;
    color:rgba(217,164,65,0.7);
  }
  .led .val{
    font-family:'Space Mono', monospace;
    font-weight:700;
    font-size:18px;
    color:var(--amber);
    text-shadow:0 0 8px rgba(217,164,65,0.5);
  }
  /* barcode stripe divider — signature element */
  .barcode-stripe{
    height:10px;
    margin-top:14px;
    background-image: repeating-linear-gradient(
      90deg,
      var(--paper) 0px, var(--paper) 2px,
      transparent 2px, transparent 3px,
      var(--paper) 3px, var(--paper) 4px,
      transparent 4px, transparent 7px,
      var(--paper) 7px, var(--paper) 9px,
      transparent 9px, transparent 10px
    );
    opacity:0.85;
  }

  main{
    flex:1;
    padding:16px 16px 90px;
    overflow-y:auto;
  }

  h2.section-title{
    font-family:'Space Mono', monospace;
    font-size:13px;
    letter-spacing:1.5px;
    text-transform:uppercase;
    color:var(--ink-soft);
    margin:0 0 10px;
  }

  /* ---- Nav ---- */
  nav.tabbar{
    position:fixed;
    bottom:0;
    left:50%;
    transform:translateX(-50%);
    width:100%;
    max-width:480px;
    background:var(--forest);
    display:flex;
    z-index:5;
    box-shadow:0 -2px 12px rgba(0,0,0,0.2);
  }
  nav.tabbar button{
    flex:1;
    background:none;
    border:none;
    color:rgba(246,241,228,0.55);
    padding:10px 4px calc(12px + env(safe-area-inset-bottom));
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:4px;
    font-family:'IBM Plex Sans', sans-serif;
    font-size:10.5px;
    letter-spacing:0.5px;
    text-transform:uppercase;
    cursor:pointer;
    position:relative;
  }
  nav.tabbar button.active{ color:var(--amber); }
  nav.tabbar button svg{ width:20px; height:20px; }
  .badge{
    position:absolute;
    top:2px;
    right:calc(50% - 20px);
    background:var(--brick);
    color:var(--paper);
    font-family:'Space Mono',monospace;
    font-size:9px;
    font-weight:700;
    border-radius:8px;
    min-width:15px;
    height:15px;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:0 3px;
  }

  /* ---- Cards ---- */
  .ticket{
    background:#fff;
    border:1px solid var(--line);
    border-radius:var(--radius);
    position:relative;
    margin-bottom:14px;
    overflow:hidden;
  }
  .ticket::before{
    content:"";
    display:block;
    height:6px;
    background-image: radial-gradient(circle, var(--paper) 3px, transparent 3.5px);
    background-size:12px 12px;
    background-position:top;
  }
  .ticket-body{ padding:14px 16px 16px; }

  /* ---- Scan view ---- */
  .scan-frame{
    background:var(--forest-dark);
    border-radius:var(--radius);
    overflow:hidden;
    position:relative;
    aspect-ratio: 4/3;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .scan-frame video, .scan-frame canvas{
    width:100%;
    height:100%;
    object-fit:cover;
  }
  #scanner-viewport{ width:100%; height:100%; position:absolute; inset:0; }
  #scanner-viewport canvas.drawingBuffer{ display:none !important; }
  .scan-guide{
    position:absolute;
    inset:0;
    pointer-events:none;
    display:flex;
    align-items:center;
    justify-content:center;
    z-index:3;
  }
  .scan-guide .box{
    width:78%;
    height:32%;
    border:2px solid rgba(217,164,65,0.85);
    border-radius:8px;
    box-shadow:0 0 0 999px rgba(18,42,33,0.35);
  }
  .scan-placeholder{
    color:rgba(246,241,228,0.55);
    text-align:center;
    padding:24px;
    font-size:13px;
    line-height:1.5;
  }
  .camera-status{
    text-align:center;
    font-size:12px;
    color:var(--ink-soft);
    margin-top:8px;
    letter-spacing:0.3px;
  }
  .camera-status.live{ color:var(--forest); font-weight:600; }
  .camera-status.error{ color:var(--brick); font-weight:600; }
  .flash-hit{
    position:absolute; inset:0;
    background:rgba(76,175,80,0.35);
    z-index:4;
    animation: flashfade 0.5s ease-out forwards;
    pointer-events:none;
  }
  @keyframes flashfade{ from{opacity:1;} to{opacity:0;} }

  .btn{
    font-family:'IBM Plex Sans', sans-serif;
    font-weight:600;
    font-size:14px;
    border:none;
    border-radius:8px;
    padding:12px 16px;
    cursor:pointer;
    display:inline-flex;
    align-items:center;
    justify-content:center;
    gap:8px;
    width:100%;
  }
  .btn-primary{ background:var(--forest); color:var(--paper); }
  .btn-primary:active{ background:var(--forest-dark); }
  .btn-amber{ background:var(--amber); color:var(--forest-dark); }
  .btn-amber:active{ background:var(--amber-dark); }
  .btn-ghost{ background:transparent; color:var(--forest); border:1.5px solid var(--line); }
  .btn-danger{ background:transparent; color:var(--brick); border:1.5px solid rgba(178,58,46,0.3); }
  .btn-sm{ padding:7px 10px; font-size:12.5px; width:auto; }
  .row{ display:flex; gap:8px; }
  .row > *{ flex:1; }

  .unknown-toast{
    margin-top:12px;
    background:#FCF3E3;
    border:1px solid rgba(217,164,65,0.5);
    border-radius:8px;
    padding:12px 14px;
    font-size:13px;
  }
  .unknown-toast .code{ font-family:'Space Mono',monospace; font-weight:700; }

  /* ---- Form ---- */
  label{
    display:block;
    font-size:11.5px;
    text-transform:uppercase;
    letter-spacing:0.8px;
    color:var(--ink-soft);
    margin:12px 0 5px;
  }
  label:first-child{ margin-top:0; }
  input[type=text], input[type=number]{
    width:100%;
    padding:11px 12px;
    border:1.5px solid var(--line);
    border-radius:7px;
    font-size:15px;
    font-family:'IBM Plex Sans', sans-serif;
    background:var(--paper);
    color:var(--ink);
  }
  input:focus{ outline:2px solid var(--amber); outline-offset:1px; }
  .barcode-input-row{ display:flex; gap:8px; }
  .barcode-input-row input{ flex:1; font-family:'Space Mono', monospace; }
  .icon-btn{
    background:var(--forest);
    color:var(--paper);
    border:none;
    border-radius:7px;
    width:44px;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
  }

  /* ---- Cart list ---- */
  .cart-item{
    display:flex;
    align-items:center;
    gap:10px;
    padding:10px 0;
    border-bottom:1px dashed var(--line);
  }
  .cart-item:last-child{ border-bottom:none; }
  .cart-item .info{ flex:1; min-width:0; }
  .cart-item .name{ font-weight:600; font-size:14px; }
  .cart-item .price{ font-size:12px; color:var(--ink-soft); font-family:'Space Mono',monospace; }
  .qty-ctrl{ display:flex; align-items:center; gap:6px; }
  .qty-ctrl button{
    width:26px; height:26px; border-radius:6px; border:1px solid var(--line);
    background:var(--paper); font-size:16px; cursor:pointer; color:var(--forest); font-weight:700;
  }
  .qty-ctrl .qty{ min-width:20px; text-align:center; font-family:'Space Mono',monospace; font-weight:700; }
  .line-total{ font-family:'Space Mono',monospace; font-weight:700; min-width:56px; text-align:right; }
  .remove-x{ background:none; border:none; color:var(--brick); font-size:16px; cursor:pointer; padding:2px 4px; }

  .total-row{
    display:flex; justify-content:space-between; align-items:baseline;
    padding-top:12px; margin-top:4px; border-top:2px solid var(--ink);
  }
  .total-row .lbl{ font-size:13px; text-transform:uppercase; letter-spacing:1px; color:var(--ink-soft); }
  .total-row .amt{ font-family:'Space Mono',monospace; font-weight:700; font-size:24px; }

  .empty-state{
    text-align:center;
    padding:40px 20px;
    color:var(--ink-soft);
  }
  .empty-state svg{ opacity:0.35; margin-bottom:10px; }
  .empty-state .t{ font-weight:600; margin-bottom:4px; color:var(--ink); }
  .empty-state .d{ font-size:13px; }

  /* ---- Items list ---- */
  .item-row{
    display:flex; align-items:center; gap:10px;
    padding:12px 0; border-bottom:1px solid var(--line);
  }
  .item-row:last-child{ border-bottom:none; }
  .item-row .info{ flex:1; min-width:0; }
  .item-row .name{ font-weight:600; font-size:14px; }
  .item-row .meta{ font-size:11.5px; color:var(--ink-soft); font-family:'Space Mono',monospace; }
  .stock-pill{
    font-size:10.5px; font-family:'Space Mono',monospace; font-weight:700;
    padding:2px 7px; border-radius:20px; white-space:nowrap;
  }
  .stock-ok{ background:rgba(31,71,54,0.1); color:var(--forest); }
  .stock-low{ background:rgba(178,58,46,0.12); color:var(--brick); }
  .item-actions{ display:flex; gap:6px; }
  .item-actions button{
    background:none; border:none; cursor:pointer; padding:5px; color:var(--ink-soft);
  }
  .item-actions button:hover{ color:var(--ink); }

  .search-bar{
    display:flex; gap:8px; margin-bottom:14px;
  }
  .search-bar input{ flex:1; }

  /* ---- Receipt / checkout success ---- */
  .receipt-view{ text-align:center; padding:10px 4px; }
  .receipt-view .stamp{
    width:64px; height:64px; border-radius:50%;
    background:var(--forest); color:var(--paper);
    display:flex; align-items:center; justify-content:center;
    margin:0 auto 14px;
  }
  .receipt-view h3{ margin:0 0 4px; font-family:'Space Mono',monospace; }
  .receipt-view .amt{ font-family:'Space Mono',monospace; font-weight:700; font-size:30px; margin:6px 0 18px; }

  .field-error{ color:var(--brick); font-size:12px; margin-top:5px; }

  .toast-banner{
    position:fixed; top:14px; left:50%; transform:translateX(-50%);
    max-width:420px; width:calc(100% - 32px);
    background:var(--ink); color:var(--paper);
    padding:10px 14px; border-radius:8px; font-size:13px;
    z-index:50; text-align:center;
    box-shadow:0 4px 16px rgba(0,0,0,0.25);
  }

  a.linklike{ color:var(--forest); text-decoration:underline; cursor:pointer; }
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="brand-row">
      <div class="brand">
        <span class="mark">TILL</span>
        <span class="sub">Counter POS</span>
      </div>
      <div class="led">
        <div class="lbl">Cart Total</div>
        <div class="val mono" id="headerTotal">$0.00</div>
      </div>
    </div>
    <div class="barcode-stripe"></div>
  </header>

  <main id="main"></main>

  <nav class="tabbar">
    <button data-tab="scan" class="active">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="6" width="20" height="12" rx="2"/><line x1="6" y1="6" x2="6" y2="18"/><line x1="9" y1="6" x2="9" y2="18"/><line x1="13" y1="6" x2="13" y2="18"/><line x1="16" y1="6" x2="16" y2="18"/><line x1="19" y1="6" x2="19" y2="18"/></svg>
      Scan
    </button>
    <button data-tab="cart">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/></svg>
      Cart
      <span class="badge" id="cartBadge" style="display:none;">0</span>
    </button>
    <button data-tab="items">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 8V21H3V8"/><path d="M1 3h22v5H1z"/><line x1="10" y1="12" x2="14" y2="12"/></svg>
      Items
    </button>
  </nav>
</div>

<script>
/* ---------------------------------------------------------
   STATE
--------------------------------------------------------- */
let inventory = {};   // barcode -> {barcode,name,price,stock}
let cart = [];         // {barcode,name,price,qty}
let salesLog = [];
let currentTab = 'scan';
let scanning = false;
let lastDetected = { code:null, time:0 };
let scanMode = 'sell';       // 'sell' | 'capture'
let editingBarcode = null;   // when editing an existing item
let lastReceipt = null;
let itemSearchQuery = '';

const money = n => '₵' + (Math.round(n*100)/100).toFixed(2);

/* ---------------------------------------------------------
   STORAGE
   Uses the browser's own local storage on this device, so
   the app works fully standalone (no server, no account).
   Wrapped behind a small db object so a real backend can be
   swapped in later without touching the rest of the app.
--------------------------------------------------------- */
const STORAGE_PREFIX = 'tillpos:';
const STORAGE_VERSION = 1;

const db = {
  get(key){
    try{
      const raw = window.localStorage.getItem(STORAGE_PREFIX + key);
      return raw ? JSON.parse(raw) : null;
    }catch(e){
      console.warn('Storage read failed for', key, e);
      return null;
    }
  },
  set(key, value){
    try{
      window.localStorage.setItem(STORAGE_PREFIX + key, JSON.stringify(value));
      return true;
    }catch(e){
      console.warn('Storage write failed for', key, e);
      if(e && e.name === 'QuotaExceededError'){
        showToast('Device storage is full — could not save.');
      }
      return false;
    }
  }
};

function storageAvailable(){
  try{
    const t = '__tillpos_test__';
    window.localStorage.setItem(t, '1');
    window.localStorage.removeItem(t);
    return true;
  }catch(e){ return false; }
}

async function loadAll(){
  if(!storageAvailable()){
    showToast('This browser is blocking local storage — data won\u2019t be saved between visits.');
  }
  const meta = db.get('meta');
  if(!meta) db.set('meta', { version: STORAGE_VERSION });

  inventory = db.get('inventory');
  if(!inventory){
    inventory = {
      "0000000001": {barcode:"0000000001", name:"House Blend Coffee 12oz", price:8.50, stock:24},
      "0000000002": {barcode:"0000000002", name:"Oat Milk 1L", price:3.20, stock:15},
      "0000000003": {barcode:"0000000003", name:"Sourdough Loaf", price:5.75, stock:8}
    };
    saveInventory();
  }
  cart = db.get('cart') || [];
  salesLog = db.get('sales') || [];
}
function saveInventory(){ db.set('inventory', inventory); }
function saveCart(){ db.set('cart', cart); }
function saveSales(){ db.set('sales', salesLog.slice(-200)); }

function exportBackup(){
  const payload = {
    exportedAt: new Date().toISOString(),
    version: STORAGE_VERSION,
    inventory, cart, sales: salesLog
  };
  const blob = new Blob([JSON.stringify(payload, null, 2)], { type:'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  const stamp = new Date().toISOString().slice(0,10);
  a.href = url;
  a.download = `till-pos-backup-${stamp}.json`;
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
}

function importBackup(file){
  const reader = new FileReader();
  reader.onload = () => {
    try{
      const data = JSON.parse(reader.result);
      if(!data || typeof data.inventory !== 'object') throw new Error('bad file');
      inventory = data.inventory || {};
      cart = Array.isArray(data.cart) ? data.cart : [];
      salesLog = Array.isArray(data.sales) ? data.sales : [];
      saveInventory(); saveCart(); saveSales();
      showToast('Backup restored.');
      render();
    }catch(e){
      showToast('Could not read that backup file.');
    }
  };
  reader.readAsText(file);
}

/* ---------------------------------------------------------
   RENDER ROOT
--------------------------------------------------------- */
function render(){
  updateHeader();
  const main = document.getElementById('main');
  if(currentTab==='scan') main.innerHTML = renderScan();
  else if(currentTab==='cart') main.innerHTML = renderCart();
  else if(currentTab==='items') main.innerHTML = renderItems(itemSearchQuery);
  else if(currentTab==='addItem') main.innerHTML = renderAddItem();
  else if(currentTab==='receipt') main.innerHTML = renderReceipt();
  attachHandlers();
}

function updateHeader(){
  const total = cart.reduce((s,i)=>s+i.price*i.qty,0);
  document.getElementById('headerTotal').textContent = money(total);
  const badge = document.getElementById('cartBadge');
  const count = cart.reduce((s,i)=>s+i.qty,0);
  if(count>0){ badge.style.display='flex'; badge.textContent = count; }
  else{ badge.style.display='none'; }
  document.querySelectorAll('nav.tabbar button').forEach(b=>{
    b.classList.toggle('active', b.dataset.tab === (currentTab==='addItem' || currentTab==='receipt' ? (scanMode==='capture'?'items':currentTab) : currentTab));
  });
}

/* ---------------------------------------------------------
   SCAN TAB
--------------------------------------------------------- */
function renderScan(){
  return `
    <h2 class="section-title">Scan to sell</h2>
    <div class="scan-frame" id="scanFrame">
      <div id="scanner-viewport"></div>
      <div class="scan-guide"><div class="box"></div></div>
      <div class="scan-placeholder" id="scanPlaceholder">
        Requesting camera access…
      </div>
    </div>
    <div class="camera-status" id="cameraStatus">Turning on camera…</div>
    <div class="row" style="margin-top:10px;">
      <button class="btn btn-ghost" id="restartScanBtn">Restart camera</button>
      <button class="btn btn-ghost" id="manualEntryBtn">Type barcode</button>
    </div>
    <div id="manualEntryBox" style="display:none; margin-top:10px;">
      <div class="barcode-input-row">
        <input type="text" id="manualBarcode" inputmode="numeric" placeholder="Enter barcode number">
        <button class="icon-btn" id="manualGoBtn" aria-label="Look up">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
        </button>
      </div>
    </div>
    <div id="unknownBox"></div>

    <h2 class="section-title" style="margin-top:20px;">Or find by name</h2>
    <div class="search-bar" style="margin-bottom:8px;">
      <input type="text" id="nameSearch" placeholder="Type a product name…" autocomplete="off">
    </div>
    <div id="nameSearchResults"></div>
  `;
}

function renderNameSearchResults(query){
  const q = query.trim().toLowerCase();
  if(!q) return '';
  const matches = Object.values(inventory)
    .filter(it => it.name.toLowerCase().includes(q))
    .sort((a,b)=>a.name.localeCompare(b.name))
    .slice(0, 20);
  if(matches.length===0){
    return `<div class="unknown-toast">No items match "${escapeHtml(query)}".</div>`;
  }
  const rows = matches.map(it=>`
    <div class="item-row search-result" data-code="${escapeAttr(it.barcode)}" style="cursor:pointer;">
      <div class="info">
        <div class="name">${escapeHtml(it.name)}</div>
        <div class="meta">${money(it.price)} · ${it.stock} in stock</div>
      </div>
      <button class="btn btn-amber btn-sm add-search-result" data-code="${escapeAttr(it.barcode)}">Add</button>
    </div>
  `).join('');
  return `<div class="ticket"><div class="ticket-body">${rows}</div></div>`;
}

function startScanner(){
  const placeholder = document.getElementById('scanPlaceholder');
  const status = document.getElementById('cameraStatus');

  const isSecure = window.isSecureContext || location.hostname === 'localhost' || location.hostname === '127.0.0.1';
  if(!isSecure){
    if(placeholder){
      placeholder.style.display='flex';
      placeholder.style.alignItems='center';
      placeholder.style.justifyContent='center';
      placeholder.textContent = 'Camera access needs a secure (https) connection. Open this page over https, or type the barcode instead.';
    }
    if(status){ status.textContent = 'Camera unavailable on this connection'; status.className = 'camera-status error'; }
    scanning=false;
    return;
  }
  if(typeof Quagga === 'undefined'){
    if(placeholder){
      placeholder.style.display='flex';
      placeholder.style.alignItems='center';
      placeholder.style.justifyContent='center';
      placeholder.textContent = 'Scanner library failed to load — check your connection, or type the barcode instead.';
    }
    if(status){ status.textContent = 'Scanner unavailable'; status.className = 'camera-status error'; }
    scanning=false;
    return;
  }
  if(!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia)){
    if(placeholder){
      placeholder.style.display='flex';
      placeholder.style.alignItems='center';
      placeholder.style.justifyContent='center';
      placeholder.textContent = 'This browser doesn\u2019t support camera access — type the barcode instead.';
    }
    if(status){ status.textContent = 'Camera not supported'; status.className = 'camera-status error'; }
    scanning=false;
    return;
  }

  if(status){ status.textContent = 'Requesting camera access…'; status.className = 'camera-status'; }

  Quagga.init({
    inputStream:{
      name:"Live",
      type:"LiveStream",
      target: document.querySelector('#scanner-viewport'),
      constraints:{ facingMode:{ ideal:"environment" }, width:{ideal:1280}, height:{ideal:720} }
    },
    locator:{ patchSize:"medium", halfSample:true },
    numOfWorkers: 2,
    frequency: 10,
    decoder:{ readers:["ean_reader","ean_8_reader","upc_reader","upc_e_reader","code_128_reader","codabar_reader","code_39_reader"] },
    locate:true
  }, function(err){
    if(err){
      if(placeholder){
        placeholder.style.display='flex';
        placeholder.style.alignItems='center';
        placeholder.style.justifyContent='center';
        placeholder.textContent = "Camera unavailable. Allow camera access in your browser, then tap Restart camera — or type the barcode instead.";
      }
      if(status){ status.textContent = 'Camera off'; status.className = 'camera-status error'; }
      scanning=false;
      return;
    }
    if(placeholder) placeholder.style.display='none';
    Quagga.start();
    scanning=true;
    if(status){ status.textContent = '● Camera live — point at a barcode'; status.className = 'camera-status live'; }
  });
  Quagga.onDetected(handleDetected);
}

function stopScanner(){
  try{ Quagga.offDetected(handleDetected); Quagga.stop(); }catch(e){}
  scanning=false;
  const status = document.getElementById('cameraStatus');
  if(status){ status.textContent = 'Camera off'; status.className = 'camera-status'; }
}

function handleDetected(result){
  const code = result.codeResult.code;
  const now = Date.now();
  if(code === lastDetected.code && now - lastDetected.time < 1500) return;
  lastDetected = { code, time: now };
  if(navigator.vibrate) navigator.vibrate(80);
  flashHit();
  processScannedCode(code);
}

function flashHit(){
  const frame = document.getElementById('scanFrame');
  if(!frame) return;
  const el = document.createElement('div');
  el.className = 'flash-hit';
  frame.appendChild(el);
  setTimeout(()=>el.remove(), 500);
}

function processScannedCode(code){
  if(scanMode === 'capture'){
    const input = document.getElementById('itemBarcode');
    if(input) input.value = code;
    stopScanner();
    scanMode = 'sell';
    render();
    return;
  }
  const item = inventory[code];
  if(item){
    addToCart(item);
    document.getElementById('unknownBox').innerHTML = '';
    showToast(`Added ${item.name}`);
  }else{
    document.getElementById('unknownBox').innerHTML = `
      <div class="unknown-toast">
        No item matches barcode <span class="code">${escapeHtml(code)}</span>.
        <div style="margin-top:8px;">
          <button class="btn btn-amber btn-sm" id="addUnknownBtn">Add this item</button>
        </div>
      </div>`;
    const b = document.getElementById('addUnknownBtn');
    if(b) b.addEventListener('click', ()=>{ openAddItem(code); });
  }
}

/* ---------------------------------------------------------
   CART TAB
--------------------------------------------------------- */
function renderCart(){
  if(cart.length===0){
    return `
      <h2 class="section-title">Cart</h2>
      <div class="empty-state">
        <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/></svg>
        <div class="t">Cart is empty</div>
        <div class="d">Scan an item to add it here.</div>
      </div>`;
  }
  const total = cart.reduce((s,i)=>s+i.price*i.qty,0);
  const rows = cart.map(i=>`
    <div class="cart-item" data-code="${escapeAttr(i.barcode)}">
      <div class="info">
        <div class="name">${escapeHtml(i.name)}</div>
        <div class="price">${money(i.price)} each</div>
      </div>
      <div class="qty-ctrl">
        <button class="qty-dec" aria-label="Decrease">−</button>
        <span class="qty">${i.qty}</span>
        <button class="qty-inc" aria-label="Increase">+</button>
      </div>
      <div class="line-total">${money(i.price*i.qty)}</div>
      <button class="remove-x" aria-label="Remove">✕</button>
    </div>
  `).join('');
  return `
    <h2 class="section-title">Cart</h2>
    <div class="ticket"><div class="ticket-body">
      ${rows}
      <div class="total-row">
        <span class="lbl">Total</span>
        <span class="amt">${money(total)}</span>
      </div>
    </div></div>
    <button class="btn btn-amber" id="checkoutBtn">Charge ${money(total)}</button>
    <div style="height:8px;"></div>
    <button class="btn btn-ghost" id="clearCartBtn">Clear cart</button>
  `;
}

function addToCart(item){
  const existing = cart.find(c=>c.barcode===item.barcode);
  if(existing) existing.qty += 1;
  else cart.push({ barcode:item.barcode, name:item.name, price:item.price, qty:1 });
  saveCart();
  render();
}

function changeQty(barcode, delta){
  const c = cart.find(c=>c.barcode===barcode);
  if(!c) return;
  c.qty += delta;
  if(c.qty<=0) cart = cart.filter(x=>x.barcode!==barcode);
  saveCart();
  render();
}

function removeFromCart(barcode){
  cart = cart.filter(c=>c.barcode!==barcode);
  saveCart();
  render();
}

function checkout(){
  if(cart.length===0) return;
  const total = cart.reduce((s,i)=>s+i.price*i.qty,0);
  cart.forEach(ci=>{
    const inv = inventory[ci.barcode];
    if(inv) inv.stock = Math.max(0, inv.stock - ci.qty);
  });
  const sale = { id: Date.now(), items: cart.map(c=>({...c})), total, ts: new Date().toISOString() };
  salesLog.push(sale);
  lastReceipt = sale;
  cart = [];
  saveInventory(); saveSales(); saveCart();
  currentTab = 'receipt';
  render();
}

/* ---------------------------------------------------------
   RECEIPT
--------------------------------------------------------- */
function renderReceipt(){
  if(!lastReceipt) { currentTab='scan'; return renderScan(); }
  const lines = lastReceipt.items.map(i=>`
    <div class="cart-item">
      <div class="info">
        <div class="name">${escapeHtml(i.name)}</div>
        <div class="price">${i.qty} × ${money(i.price)}</div>
      </div>
      <div class="line-total">${money(i.price*i.qty)}</div>
    </div>
  `).join('');
  return `
    <div class="receipt-view">
      <div class="stamp">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
      </div>
      <h3>Sale complete</h3>
      <div class="amt">${money(lastReceipt.total)}</div>
    </div>
    <div class="ticket"><div class="ticket-body">
      ${lines}
    </div></div>
    <button class="btn btn-primary" id="newSaleBtn">Start new sale</button>
  `;
}

/* ---------------------------------------------------------
   ITEMS TAB
--------------------------------------------------------- */
function renderItems(query){
  const hasAnyItems = Object.keys(inventory).length > 0;
  return `
    <h2 class="section-title">Inventory</h2>
    <button class="btn btn-amber" id="newItemBtn" style="margin-bottom:14px;">+ Add new item</button>
    ${hasAnyItems? `
      <div class="search-bar">
        <input type="text" id="itemSearch" placeholder="Search by name or barcode…" autocomplete="off" value="${escapeAttr(query||'')}">
      </div>` : ''}
    <div id="itemsListBox">${renderItemsList(query)}</div>

    <h2 class="section-title" style="margin-top:22px;">Backup &amp; restore</h2>
    <div class="ticket"><div class="ticket-body">
      <p style="margin:0 0 12px; font-size:12.5px; color:var(--ink-soft); line-height:1.5;">
        Your items and sales are saved on this device only. Export a backup now and then to keep a copy safe.
      </p>
      <div class="row">
        <button class="btn btn-ghost" id="exportBtn">Export backup</button>
        <button class="btn btn-ghost" id="importBtn">Restore backup</button>
      </div>
      <input type="file" id="importFileInput" accept="application/json" style="display:none;">
    </div></div>
  `;
}

function renderItemsList(query){
  const q = (query || '').trim().toLowerCase();
  const hasAnyItems = Object.keys(inventory).length > 0;
  let list = Object.values(inventory).sort((a,b)=>a.name.localeCompare(b.name));
  if(q) list = list.filter(it => it.name.toLowerCase().includes(q) || it.barcode.toLowerCase().includes(q));
  if(list.length===0){
    return `
      <div class="empty-state">
        <div class="t">${hasAnyItems? 'No matches' : 'No items yet'}</div>
        <div class="d">${hasAnyItems? 'Try a different search.' : 'Add your first item to start selling.'}</div>
      </div>`;
  }
  const rows = list.map(it=>`
    <div class="item-row" data-code="${escapeAttr(it.barcode)}">
      <div class="info">
        <div class="name">${escapeHtml(it.name)}</div>
        <div class="meta">${escapeHtml(it.barcode)} · ${money(it.price)}</div>
      </div>
      <span class="stock-pill ${it.stock<=3?'stock-low':'stock-ok'}">${it.stock} in stock</span>
      <div class="item-actions">
        <button class="edit-item" aria-label="Edit">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.12 2.12 0 0 1 3 3L12 15l-4 1 1-4Z"/></svg>
        </button>
        <button class="delete-item" aria-label="Delete">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6M14 11v6M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/></svg>
        </button>
      </div>
    </div>
  `).join('');
  return `<div class="ticket"><div class="ticket-body">${rows}</div></div>`;
}

/* ---------------------------------------------------------
   ADD / EDIT ITEM
--------------------------------------------------------- */
function openAddItem(prefillBarcode){
  editingBarcode = null;
  currentTab = 'addItem';
  render();
  if(prefillBarcode){
    document.getElementById('itemBarcode').value = prefillBarcode;
  }
}

function openEditItem(barcode){
  editingBarcode = barcode;
  currentTab = 'addItem';
  render();
}

function renderAddItem(){
  const editing = editingBarcode ? inventory[editingBarcode] : null;
  return `
    <h2 class="section-title">${editing? 'Edit item' : 'Add item'}</h2>
    <div class="ticket"><div class="ticket-body">
      <label for="itemBarcode">Barcode</label>
      <div class="barcode-input-row">
        <input type="text" id="itemBarcode" inputmode="numeric" placeholder="Scan or type barcode" value="${editing? escapeAttr(editing.barcode): ''}" ${editing? 'readonly' : ''}>
        ${editing? '' : `<button class="icon-btn" id="captureScanBtn" aria-label="Scan barcode">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="6" width="20" height="12" rx="2"/><line x1="6" y1="6" x2="6" y2="18"/><line x1="9" y1="6" x2="9" y2="18"/><line x1="13" y1="6" x2="13" y2="18"/></svg>
        </button>`}
      </div>
      <div id="captureFrameBox"></div>

      <label for="itemName">Item name</label>
      <input type="text" id="itemName" placeholder="e.g. Sourdough Loaf" value="${editing? escapeAttr(editing.name): ''}">

      <label for="itemPrice">Price</label>
      <input type="number" id="itemPrice" step="0.01" min="0" placeholder="0.00" value="${editing? editing.price: ''}">

      <label for="itemStock">Stock on hand</label>
      <input type="number" id="itemStock" step="1" min="0" placeholder="0" value="${editing? editing.stock: ''}">

      <div id="itemFormError" class="field-error" style="display:none;"></div>

      <div class="row" style="margin-top:16px;">
        <button class="btn btn-ghost" id="cancelItemBtn">Cancel</button>
        <button class="btn btn-primary" id="saveItemBtn">${editing? 'Save changes':'Save item'}</button>
      </div>
      ${editing? `<div style="margin-top:10px; text-align:center;"><a class="linklike" id="deleteItemLink">Delete this item</a></div>` : ''}
    </div></div>
  `;
}

function saveItemForm(){
  const barcode = document.getElementById('itemBarcode').value.trim();
  const name = document.getElementById('itemName').value.trim();
  const price = parseFloat(document.getElementById('itemPrice').value);
  const stock = parseInt(document.getElementById('itemStock').value, 10);
  const err = document.getElementById('itemFormError');

  if(!barcode || !name || isNaN(price) || price<0 || isNaN(stock) || stock<0){
    err.textContent = 'Fill in barcode, name, a valid price and stock count.';
    err.style.display = 'block';
    return;
  }
  if(!editingBarcode && inventory[barcode]){
    err.textContent = 'An item with this barcode already exists.';
    err.style.display = 'block';
    return;
  }
  inventory[barcode] = { barcode, name, price, stock };
  saveInventory();
  editingBarcode = null;
  currentTab = 'items';
  render();
}

function deleteItem(barcode){
  delete inventory[barcode];
  saveInventory();
  currentTab = 'items';
  editingBarcode = null;
  render();
}

/* ---------------------------------------------------------
   HANDLERS
--------------------------------------------------------- */
function attachHandlers(){
  // tab nav
  document.querySelectorAll('nav.tabbar button').forEach(btn=>{
    btn.onclick = ()=>{
      if(scanning) stopScanner();
      currentTab = btn.dataset.tab;
      editingBarcode = null;
      render();
    };
  });

  if(currentTab==='scan'){
    const restartBtn = document.getElementById('restartScanBtn');
    if(restartBtn) restartBtn.onclick = ()=>{
      scanMode = 'sell';
      if(scanning) stopScanner();
      startScanner();
    };
    const manualBtn = document.getElementById('manualEntryBtn');
    if(manualBtn) manualBtn.onclick = ()=>{
      const box = document.getElementById('manualEntryBox');
      box.style.display = box.style.display==='none' ? 'block':'none';
      if(box.style.display==='block') document.getElementById('manualBarcode').focus();
    };
    const goBtn = document.getElementById('manualGoBtn');
    if(goBtn) goBtn.onclick = ()=>{
      const val = document.getElementById('manualBarcode').value.trim();
      if(val) processScannedCode(val);
      document.getElementById('manualBarcode').value='';
    };
    const manualInput = document.getElementById('manualBarcode');
    if(manualInput) manualInput.addEventListener('keydown', e=>{
      if(e.key==='Enter') document.getElementById('manualGoBtn').click();
    });

    const nameSearch = document.getElementById('nameSearch');
    if(nameSearch){
      nameSearch.addEventListener('input', e=>{
        document.getElementById('nameSearchResults').innerHTML = renderNameSearchResults(e.target.value);
        attachSearchResultHandlers();
      });
    }

    if(!scanning){
      scanMode = 'sell';
      startScanner();
    }
  }

  if(currentTab==='cart'){
    document.querySelectorAll('.qty-inc').forEach(b=>b.onclick=e=>{
      changeQty(e.target.closest('.cart-item').dataset.code, 1);
    });
    document.querySelectorAll('.qty-dec').forEach(b=>b.onclick=e=>{
      changeQty(e.target.closest('.cart-item').dataset.code, -1);
    });
    document.querySelectorAll('.remove-x').forEach(b=>b.onclick=e=>{
      removeFromCart(e.target.closest('.cart-item').dataset.code);
    });
    const checkoutBtn = document.getElementById('checkoutBtn');
    if(checkoutBtn) checkoutBtn.onclick = checkout;
    const clearBtn = document.getElementById('clearCartBtn');
    if(clearBtn) clearBtn.onclick = ()=>{ cart=[]; saveCart(); render(); };
  }

  if(currentTab==='receipt'){
    const newSaleBtn = document.getElementById('newSaleBtn');
    if(newSaleBtn) newSaleBtn.onclick = ()=>{ lastReceipt=null; currentTab='scan'; render(); };
  }

  if(currentTab==='items'){
    const newItemBtn = document.getElementById('newItemBtn');
    if(newItemBtn) newItemBtn.onclick = ()=>openAddItem(null);
    attachItemsListHandlers();
    const itemSearch = document.getElementById('itemSearch');
    if(itemSearch){
      itemSearch.addEventListener('input', e=>{
        itemSearchQuery = e.target.value;
        document.getElementById('itemsListBox').innerHTML = renderItemsList(itemSearchQuery);
        attachItemsListHandlers();
      });
    }
    const exportBtn = document.getElementById('exportBtn');
    if(exportBtn) exportBtn.onclick = exportBackup;
    const importBtn = document.getElementById('importBtn');
    const importFileInput = document.getElementById('importFileInput');
    if(importBtn && importFileInput){
      importBtn.onclick = ()=> importFileInput.click();
      importFileInput.onchange = (e)=>{
        const file = e.target.files && e.target.files[0];
        if(file){
          if(confirm('Restoring a backup will replace all current items, cart and sales on this device. Continue?')){
            importBackup(file);
          }
        }
        importFileInput.value = '';
      };
    }
  }

  if(currentTab==='addItem'){
    const cancelBtn = document.getElementById('cancelItemBtn');
    if(cancelBtn) cancelBtn.onclick = ()=>{ if(scanning) stopScanner(); editingBarcode=null; currentTab='items'; render(); };
    const saveBtn = document.getElementById('saveItemBtn');
    if(saveBtn) saveBtn.onclick = saveItemForm;
    const deleteLink = document.getElementById('deleteItemLink');
    if(deleteLink) deleteLink.onclick = ()=>{
      if(confirm(`Delete "${inventory[editingBarcode].name}"?`)) deleteItem(editingBarcode);
    };
    const captureBtn = document.getElementById('captureScanBtn');
    if(captureBtn) captureBtn.onclick = ()=>{
      scanMode = 'capture';
      const box = document.getElementById('captureFrameBox');
      box.innerHTML = `
        <div class="scan-frame" id="scanFrame" style="margin-top:10px;">
          <div id="scanner-viewport"></div>
          <div class="scan-guide"><div class="box"></div></div>
        </div>`;
      startScanner();
      captureBtn.style.display='none';
    };
  }
}

function attachItemsListHandlers(){
  document.querySelectorAll('.edit-item').forEach(b=>b.onclick=e=>{
    openEditItem(e.target.closest('.item-row').dataset.code);
  });
  document.querySelectorAll('.delete-item').forEach(b=>b.onclick=e=>{
    const code = e.target.closest('.item-row').dataset.code;
    if(confirm(`Delete "${inventory[code].name}"?`)) deleteItem(code);
  });
}

function attachSearchResultHandlers(){
  document.querySelectorAll('.add-search-result').forEach(b=>{
    b.onclick = (e)=>{
      e.stopPropagation();
      const code = b.dataset.code;
      const item = inventory[code];
      if(item){ addToCart(item); showToast(`Added ${item.name}`); }
    };
  });
  document.querySelectorAll('.search-result').forEach(row=>{
    row.onclick = ()=>{
      const code = row.dataset.code;
      const item = inventory[code];
      if(item){ addToCart(item); showToast(`Added ${item.name}`); }
    };
  });
}

/* ---------------------------------------------------------
   UTIL
--------------------------------------------------------- */
function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function escapeAttr(s){ return escapeHtml(s); }
function showToast(msg){
  const t = document.createElement('div');
  t.className = 'toast-banner';
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(()=>t.remove(), 1600);
}

/* ---------------------------------------------------------
   INIT
--------------------------------------------------------- */
(async function init(){
  try{
    await loadAll();
    render();
  }catch(e){
    console.error('Till POS failed to start', e);
    document.getElementById('main').innerHTML = `
      <div class="empty-state">
        <div class="t">Something went wrong loading Till</div>
        <div class="d">Try reloading the page. If this keeps happening, clear this site's data in your browser settings.</div>
      </div>`;
  }
})();
</script>
