<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
<title>Scanline POS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js"></script>
<style>
  :root{
    --ink:#14171F;
    --ink-2:#1E2230;
    --paper:#F7F8FA;
    --panel:#FFFFFF;
    --line:#E4E7EC;
    --text:#1B1F27;
    --text-2:#6B7280;
    --amber:#F0A202;
    --amber-dark:#C9820A;
    --laser:#FF2D2D;
    --green:#1DB876;
    --green-bg:#E7F8F1;
    --red-bg:#FFECEC;
    --radius:14px;
    --shadow: 0 1px 2px rgba(20,23,31,0.04), 0 8px 24px -12px rgba(20,23,31,0.18);
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    background:var(--paper);
    color:var(--text);
    font-family:'Inter',system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;
    overflow:hidden;
    overscroll-behavior:none;
  }
  h1,h2,h3,.display{font-family:'Space Grotesk',sans-serif;}
  .mono{font-family:'IBM Plex Mono',monospace;}
  button{font-family:inherit;cursor:pointer;}
  input,select{font-family:inherit;}
  ::selection{background:var(--amber);color:var(--ink);}

  /* ---------- App shell ---------- */
  #shell{display:flex;height:100vh;height:100dvh;width:100vw;}

  .barcode-mark{display:flex;align-items:flex-end;gap:2px;height:22px;}
  .barcode-mark i{display:block;background:var(--amber);width:2px;}
  .barcode-mark i:nth-child(1){height:100%;}
  .barcode-mark i:nth-child(2){height:60%;width:3px;}
  .barcode-mark i:nth-child(3){height:85%;}
  .barcode-mark i:nth-child(4){height:45%;width:4px;}
  .barcode-mark i:nth-child(5){height:100%;width:2px;}
  .barcode-mark i:nth-child(6){height:70%;}
  .barcode-mark i:nth-child(7){height:50%;width:3px;}

  #sidebar{
    width:84px;background:var(--ink);flex:0 0 auto;
    display:flex;flex-direction:column;align-items:center;
    padding:20px 0;gap:8px;
  }
  #sidebar .brand{margin-bottom:22px;display:flex;flex-direction:column;align-items:center;gap:8px;}
  #sidebar .brand span{color:#fff;font-size:10px;letter-spacing:.14em;font-weight:600;opacity:.7;}
  .nav-btn{
    width:56px;height:56px;border:none;border-radius:12px;background:transparent;
    color:#8A8FA3;display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:5px;font-size:10px;font-weight:600;letter-spacing:.02em;transition:all .15s ease;
  }
  .nav-btn svg{width:20px;height:20px;stroke:#8A8FA3;transition:stroke .15s ease;}
  .nav-btn:hover{background:var(--ink-2);color:#fff;}
  .nav-btn:hover svg{stroke:#fff;}
  .nav-btn.active{background:var(--ink-2);color:var(--amber);}
  .nav-btn.active svg{stroke:var(--amber);}

  #main-col{flex:1 1 auto;display:flex;flex-direction:column;min-width:0;}
  #topbar{
    height:64px;flex:0 0 auto;background:var(--panel);border-bottom:1px solid var(--line);
    display:flex;align-items:center;justify-content:space-between;padding:0 24px;gap:16px;
  }
  #topbar h1{font-size:18px;margin:0;font-weight:600;}
  #topbar .sub{font-size:12px;color:var(--text-2);margin-top:1px;}
  #clock{font-size:12px;color:var(--text-2);}
  #topbar-right{display:flex;align-items:center;gap:16px;flex:0 0 auto;}
  .cart-btn{
    position:relative;display:flex;align-items:center;gap:8px;background:var(--ink);color:#fff;
    border:none;border-radius:10px;padding:9px 14px;font-size:13px;font-weight:600;
  }
  .cart-btn svg{width:17px;height:17px;}
  .cart-badge{
    position:absolute;top:-6px;right:-6px;background:var(--amber);color:var(--ink);
    font-size:10px;font-weight:700;min-width:18px;height:18px;border-radius:100px;
    display:flex;align-items:center;justify-content:center;padding:0 4px;
  }

  #page{flex:1 1 auto;overflow:auto;padding:22px 24px 40px;}

  /* ---------- Floating cart bar (Sell screen) ---------- */
  .cart-float-wrap{position:sticky;bottom:0;padding-top:14px;margin-top:auto;}
  .cart-float{
    background:var(--ink);color:#fff;border-radius:14px;padding:14px 18px;
    display:flex;align-items:center;justify-content:space-between;gap:14px;
    box-shadow:0 12px 30px -8px rgba(20,23,31,.45);
  }
  .cart-float .cf-info{display:flex;flex-direction:column;}
  .cart-float .cf-info span:first-child{font-size:11px;color:#A7ACC0;}
  .cart-float .cf-info span:last-child{font-family:'IBM Plex Mono',monospace;font-size:16px;font-weight:600;}

  /* ---------- Checkout screen ---------- */
  .checkout-wrap{max-width:520px;margin:0 auto;height:100%;display:flex;flex-direction:column;}
  .checkout-back{display:flex;align-items:center;gap:6px;background:none;border:none;color:var(--text-2);font-size:13px;font-weight:600;margin-bottom:14px;align-self:flex-start;}
  .checkout-back svg{width:15px;height:15px;}
  .checkout-back:hover{color:var(--text);}

  /* ---------- Buttons ---------- */
  .btn{
    display:inline-flex;align-items:center;justify-content:center;gap:8px;
    border-radius:10px;border:1px solid transparent;padding:10px 16px;font-weight:600;font-size:13.5px;
    transition:transform .1s ease, filter .1s ease;
  }
  .btn:active{transform:scale(.97);}
  .btn-amber{background:var(--amber);color:var(--ink);}
  .btn-amber:hover{filter:brightness(1.05);}
  .btn-dark{background:var(--ink);color:#fff;}
  .btn-dark:hover{filter:brightness(1.2);}
  .btn-ghost{background:transparent;color:var(--text);border-color:var(--line);}
  .btn-ghost:hover{background:var(--paper);}
  .btn-danger{background:var(--red-bg);color:#C81E1E;}
  .btn-danger:hover{filter:brightness(0.97);}
  .btn-sm{padding:6px 10px;font-size:12px;border-radius:8px;}
  .btn[disabled]{opacity:.4;cursor:not-allowed;}
  .btn svg{width:15px;height:15px;}

  /* ---------- POS layout ---------- */
  .pos-grid{display:flex;gap:20px;height:100%;align-items:flex-start;}
  .pos-left{flex:1 1 auto;min-width:0;display:flex;flex-direction:column;gap:16px;height:100%;}
  .pos-right{width:360px;flex:0 0 auto;height:100%;}

  .scan-cta{
    background:var(--ink);border-radius:var(--radius);padding:18px 20px;color:#fff;
    display:flex;align-items:center;justify-content:space-between;gap:16px;
    box-shadow:var(--shadow);position:relative;overflow:hidden;
  }
  .scan-cta::after{
    content:"";position:absolute;inset:0;
    background:repeating-linear-gradient(90deg, rgba(255,255,255,.05) 0 2px, transparent 2px 6px, rgba(255,255,255,.05) 6px 7px, transparent 7px 13px);
    pointer-events:none;
  }
  .scan-cta .txt h2{margin:0 0 4px;font-size:16px;}
  .scan-cta .txt p{margin:0;font-size:12.5px;color:#A7ACC0;}
  .scan-cta button{position:relative;z-index:1;white-space:nowrap;}

  .search-row{display:flex;gap:10px;}
  .search-row input{
    flex:1;border:1px solid var(--line);background:var(--panel);border-radius:10px;
    padding:10px 14px;font-size:13.5px;outline:none;
  }
  .search-row input:focus{border-color:var(--amber);}

  .product-grid{
    display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px;
    overflow-y:auto;padding-bottom:20px;
  }
  .p-card{
    background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px;
    display:flex;flex-direction:column;gap:8px;text-align:left;transition:border-color .12s, transform .08s;
  }
  .p-card:hover{border-color:var(--amber);transform:translateY(-1px);}
  .p-card[disabled]{opacity:.45;cursor:not-allowed;}
  .p-card[disabled]:hover{transform:none;border-color:var(--line);}
  .p-avatar{
    width:100%;aspect-ratio:1.5;border-radius:8px;background:var(--paper);
    display:flex;align-items:center;justify-content:center;font-family:'Space Grotesk',sans-serif;
    font-weight:700;font-size:20px;color:var(--text-2);
  }
  .p-card .p-name{font-size:13px;font-weight:600;line-height:1.25;}
  .p-card .p-meta{display:flex;justify-content:space-between;align-items:center;}
  .p-card .p-price{font-family:'IBM Plex Mono',monospace;font-size:13px;font-weight:600;}
  .p-stock{font-size:10px;padding:2px 6px;border-radius:100px;background:var(--paper);color:var(--text-2);}
  .p-stock.low{background:var(--red-bg);color:#C81E1E;}

  .empty-state{
    flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
    color:var(--text-2);gap:10px;text-align:center;padding:40px;
  }
  .empty-state svg{width:40px;height:40px;stroke:#C8CCD8;}
  .empty-state p{margin:0;font-size:13px;max-width:240px;}

  /* ---------- Receipt / cart ---------- */
  .receipt{
    background:var(--panel);border-radius:var(--radius);box-shadow:var(--shadow);
    height:100%;display:flex;flex-direction:column;overflow:hidden;position:relative;
  }
  .receipt-top{
    background-image: radial-gradient(circle at 8px 0, transparent 8px, var(--paper) 8.5px);
    background-size: 16px 16px; background-position: -4px -8px; height:12px;
    background-color:var(--ink);
  }
  .receipt-head{background:var(--ink);color:#fff;padding:16px 18px 14px;}
  .receipt-head h3{margin:0 0 2px;font-size:14px;}
  .receipt-head .rmeta{font-size:11px;color:#A7ACC0;font-family:'IBM Plex Mono',monospace;}
  .receipt-body{flex:1;overflow-y:auto;padding:14px 18px;display:flex;flex-direction:column;gap:0;}
  .r-item{display:flex;align-items:center;gap:8px;padding:9px 0;border-bottom:1px dashed var(--line);}
  .r-item:last-child{border-bottom:none;}
  .r-item .r-name{flex:1;font-size:12.5px;font-weight:500;line-height:1.25;}
  .r-item .r-name small{display:block;color:var(--text-2);font-family:'IBM Plex Mono',monospace;font-size:10.5px;margin-top:2px;}
  .qty-ctl{display:flex;align-items:center;gap:6px;}
  .qty-ctl button{width:20px;height:20px;border-radius:6px;border:1px solid var(--line);background:var(--panel);font-size:13px;line-height:1;display:flex;align-items:center;justify-content:center;}
  .qty-ctl span{font-family:'IBM Plex Mono',monospace;font-size:12px;min-width:14px;text-align:center;}
  .r-item .r-line-total{font-family:'IBM Plex Mono',monospace;font-size:12.5px;width:60px;text-align:right;}
  .r-remove{background:none;border:none;color:#C8CCD8;font-size:15px;padding:0 0 0 2px;}
  .r-remove:hover{color:var(--laser);}

  .receipt-tot{border-top:1px solid var(--line);padding:14px 18px 18px;background:var(--panel);}
  .tot-row{display:flex;justify-content:space-between;font-size:12.5px;color:var(--text-2);padding:3px 0;font-family:'IBM Plex Mono',monospace;}
  .tot-row.grand{color:var(--text);font-size:17px;font-weight:700;padding-top:8px;}
  .charge-btn{width:100%;margin-top:12px;padding:13px;font-size:14px;border-radius:11px;}

  /* ---------- Tables ---------- */
  .toolbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;gap:12px;flex-wrap:wrap;}
  .toolbar-search{border:1px solid var(--line);border-radius:10px;padding:10px 14px;font-size:13.5px;width:280px;outline:none;background:var(--panel);}
  .toolbar-search:focus{border-color:var(--amber);}
  table{width:100%;border-collapse:collapse;background:var(--panel);border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow);}
  thead th{
    text-align:left;font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--text-2);
    padding:12px 16px;border-bottom:1px solid var(--line);font-weight:600;
  }
  tbody td{padding:12px 16px;border-bottom:1px solid var(--line);font-size:13px;}
  tbody tr:last-child td{border-bottom:none;}
  tbody tr:hover{background:#FAFAFB;}
  tbody tr.low-row{box-shadow:inset 3px 0 0 var(--amber);}
  .tag{font-size:11px;background:var(--paper);color:var(--text-2);padding:3px 9px;border-radius:100px;}
  .row-actions{display:flex;gap:6px;}
  .icon-btn{width:28px;height:28px;border-radius:8px;border:1px solid var(--line);background:var(--panel);display:flex;align-items:center;justify-content:center;}
  .icon-btn:hover{background:var(--paper);}
  .icon-btn svg{width:14px;height:14px;stroke:var(--text-2);}

  /* ---------- Modals ---------- */
  .overlay{
    position:fixed;inset:0;background:rgba(20,23,31,.55);backdrop-filter:blur(2px);
    display:none;align-items:center;justify-content:center;z-index:50;padding:20px;
  }
  .overlay.open{display:flex;}
  .modal{
    background:var(--panel);border-radius:16px;width:100%;max-width:420px;max-height:88vh;
    display:flex;flex-direction:column;overflow:hidden;box-shadow:0 20px 60px -12px rgba(0,0,0,.35);
  }
  .modal-head{padding:18px 20px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;}
  .modal-head h3{margin:0;font-size:15px;}
  .modal-close{width:28px;height:28px;border-radius:8px;border:none;background:var(--paper);display:flex;align-items:center;justify-content:center;color:var(--text-2);font-size:16px;}
  .modal-body{padding:18px 20px;overflow-y:auto;display:flex;flex-direction:column;gap:14px;}
  .modal-foot{padding:16px 20px;border-top:1px solid var(--line);display:flex;gap:10px;justify-content:flex-end;}
  .field{display:flex;flex-direction:column;gap:6px;}
  .field label{font-size:11.5px;font-weight:600;color:var(--text-2);letter-spacing:.02em;}
  .field input,.field select{
    border:1px solid var(--line);border-radius:9px;padding:10px 12px;font-size:13.5px;outline:none;background:var(--panel);
  }
  .field input:focus,.field select:focus{border-color:var(--amber);}
  .field .err{font-size:11px;color:#C81E1E;display:none;}
  .field.has-err input{border-color:#C81E1E;}
  .field.has-err .err{display:block;}
  .barcode-field{display:flex;gap:8px;}
  .barcode-field input{flex:1;font-family:'IBM Plex Mono',monospace;}
  .two-col{display:grid;grid-template-columns:1fr 1fr;gap:12px;}

  /* ---------- Scanner modal ---------- */
  #scanner-overlay{position:fixed;inset:0;background:rgba(10,11,16,.92);z-index:100;display:none;flex-direction:column;}
  #scanner-overlay.open{display:flex;}
  .scan-head{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;flex:0 0 auto;}
  .scan-head .st{color:#fff;}
  .scan-head .st h3{margin:0;font-size:14px;}
  .scan-head .st p{margin:2px 0 0;font-size:11.5px;color:#9AA0B4;}
  .scan-x{width:34px;height:34px;border-radius:100px;background:rgba(255,255,255,.1);border:none;color:#fff;font-size:16px;}
  .scan-stage{flex:1;position:relative;display:flex;align-items:center;justify-content:center;overflow:hidden;}
  .scan-success{
    position:absolute;inset:0;z-index:3;display:none;align-items:center;justify-content:center;
    flex-direction:column;gap:12px;background:rgba(10,11,16,.82);
  }
  .scan-success.show{display:flex;}
  .scan-success-check{
    width:76px;height:76px;border-radius:100%;background:var(--green);color:#fff;
    display:flex;align-items:center;justify-content:center;
    animation:scan-pop .28s cubic-bezier(.34,1.56,.64,1);
  }
  .scan-success-check svg{width:38px;height:38px;}
  .scan-success-label{color:#fff;font-weight:600;font-size:14.5px;font-family:'Space Grotesk',sans-serif;text-align:center;padding:0 24px;}
  @keyframes scan-pop{from{transform:scale(.4);opacity:0;}to{transform:scale(1);opacity:1;}}
  #scanner-view{width:100%;max-width:520px;}
  #scanner-view video{width:100% !important;border-radius:14px;}
  .reticle{
    position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
    width:min(78%,340px);height:150px;border-radius:16px;pointer-events:none;
    box-shadow:0 0 0 2000px rgba(10,11,16,.45);border:2px solid rgba(255,255,255,.85);
    transition:border-color .12s ease;
  }
  .reticle.hit{border-color:var(--green);}
  .reticle.miss{border-color:var(--laser);}
  .reticle::before,.reticle::after{content:"";position:absolute;left:0;right:0;height:2px;background:var(--laser);box-shadow:0 0 8px 1px var(--laser);}
  .reticle .laser-line{position:absolute;left:4%;right:4%;height:2px;background:var(--laser);box-shadow:0 0 10px 2px var(--laser);animation:sweep 1.6s ease-in-out infinite;}
  @keyframes sweep{0%{top:8%;}50%{top:88%;}100%{top:8%;}}
  .corner{position:absolute;width:22px;height:22px;border-color:var(--amber);}
  .corner.tl{top:-2px;left:-2px;border-top:3px solid var(--amber);border-left:3px solid var(--amber);border-radius:6px 0 0 0;}
  .corner.tr{top:-2px;right:-2px;border-top:3px solid var(--amber);border-right:3px solid var(--amber);border-radius:0 6px 0 0;}
  .corner.bl{bottom:-2px;left:-2px;border-bottom:3px solid var(--amber);border-left:3px solid var(--amber);border-radius:0 0 0 6px;}
  .corner.br{bottom:-2px;right:-2px;border-bottom:3px solid var(--amber);border-right:3px solid var(--amber);border-radius:0 0 6px 0;}
  .scan-note{text-align:center;color:#C8CCD8;font-size:12px;padding:6px 20px 0;min-height:16px;}
  .scan-manual{flex:0 0 auto;padding:16px 20px 24px;display:flex;gap:10px;max-width:520px;margin:0 auto;width:100%;}
  .scan-manual input{
    flex:1;border-radius:10px;border:1px solid rgba(255,255,255,.18);background:rgba(255,255,255,.06);
    color:#fff;padding:11px 14px;font-size:13px;outline:none;font-family:'IBM Plex Mono',monospace;
  }
  .scan-manual input::placeholder{color:#6C7288;}
  .scan-flip{flex:0 0 auto;}
  .flip-row{display:flex;justify-content:center;gap:10px;padding-bottom:10px;}
  .flip-btn{background:rgba(255,255,255,.08);color:#fff;border:1px solid rgba(255,255,255,.15);border-radius:100px;padding:7px 14px;font-size:12px;display:flex;gap:6px;align-items:center;}
  .torch-btn{background:rgba(255,255,255,.08);color:#fff;border:1px solid rgba(255,255,255,.15);border-radius:100px;padding:7px 14px;font-size:12px;display:none;gap:6px;align-items:center;}
  .torch-btn.active{background:var(--amber);color:var(--ink);border-color:var(--amber);}

  /* ---------- Toast ---------- */
  #toast-container{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);z-index:200;display:flex;flex-direction:column;gap:8px;align-items:center;}
  .toast{
    background:var(--ink);color:#fff;padding:11px 18px;border-radius:100px;font-size:13px;font-weight:500;
    box-shadow:0 8px 24px -6px rgba(0,0,0,.4);display:flex;align-items:center;gap:8px;
    animation:toast-in .18s ease;
  }
  .toast.error{background:#C81E1E;}
  .toast.success{background:var(--green);color:#fff;}
  @keyframes toast-in{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:translateY(0);}}

  .stat-row{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:18px;}
  .stat-card{background:var(--panel);border-radius:var(--radius);padding:16px 18px;box-shadow:var(--shadow);}
  .stat-card .lbl{font-size:11px;color:var(--text-2);text-transform:uppercase;letter-spacing:.06em;font-weight:600;}
  .stat-card .val{font-family:'IBM Plex Mono',monospace;font-size:22px;font-weight:600;margin-top:6px;}

  ::-webkit-scrollbar{width:8px;height:8px;}
  ::-webkit-scrollbar-thumb{background:#D6D9E0;border-radius:10px;}

  @media (max-width:880px){
    #shell{flex-direction:column;}
    #sidebar{
      order:2;width:100%;flex-direction:row;justify-content:space-around;
      padding:8px 6px calc(8px + env(safe-area-inset-bottom));
      border-top:1px solid var(--ink-2);flex:0 0 auto;
    }
    #sidebar .brand{display:none;}
    .nav-btn{width:auto;flex:1;min-height:52px;}
    #main-col{order:1;min-height:0;flex:1 1 auto;}
    .pos-grid{flex-direction:column;}
    .pos-right{width:100%;height:340px;}
    .stat-row{grid-template-columns:repeat(2,1fr);}

    /* Inputs at 16px+ stop iOS Safari from zooming the page in on focus */
    input,select,textarea{font-size:16px;}
    .btn-sm{font-size:13px;}

    /* Bigger touch targets */
    .icon-btn{width:36px;height:36px;}
    .icon-btn svg{width:16px;height:16px;}
    .qty-ctl button{width:30px;height:30px;}
    .r-remove{padding:6px;font-size:17px;}

    /* Toolbar stacks and search goes full width */
    .toolbar{flex-direction:column;align-items:stretch;}
    .toolbar-search{width:100%;}

    /* Cart bar respects the home-indicator safe area */
    .cart-float-wrap{padding-bottom:env(safe-area-inset-bottom);}

    /* Nested scroll areas get proper momentum scrolling on iOS */
    #page,.product-grid,.receipt-body,.modal-body{
      -webkit-overflow-scrolling:touch;overscroll-behavior:contain;
    }

    /* Tables become stacked cards instead of overflowing horizontally */
    table,thead,tbody,tr,td{display:block;width:100%;}
    table{background:none;box-shadow:none;border-radius:0;}
    thead{position:absolute;left:-9999px;}
    tbody tr{
      background:var(--panel);border-radius:12px;box-shadow:var(--shadow);
      margin-bottom:10px;padding:10px 14px;border-bottom:none;
    }
    tbody tr.low-row{box-shadow:var(--shadow), inset 3px 0 0 var(--amber);}
    tbody td{
      display:flex;align-items:center;justify-content:space-between;gap:12px;
      padding:7px 0;border-bottom:1px dashed var(--line);text-align:right;
    }
    tbody td:last-child{border-bottom:none;}
    tbody td::before{
      content:attr(data-label);font-size:10.5px;font-weight:600;color:var(--text-2);
      text-transform:uppercase;letter-spacing:.04em;text-align:left;
    }
    tbody td.row-actions-cell{padding-top:10px;}
    tbody td.row-actions-cell::before{content:none;}
    .row-actions{width:100%;justify-content:flex-end;}
  }

  @media (max-width:480px){
    #topbar{padding:0 14px;gap:8px;}
    #topbar h1{font-size:16px;}
    #topbar .sub{display:none;}
    #clock{display:none;}
    #page{padding:16px 14px 28px;}
    .scan-cta{flex-direction:column;align-items:flex-start;gap:12px;}
    .scan-cta button{width:100%;}
  }
</style>
</head>
<body>

<div id="shell">
  <nav id="sidebar">
    <div class="brand">
      <div class="barcode-mark"><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>
      <span>SCANLINE</span>
    </div>
    <button class="nav-btn" data-view="pos">
      <svg fill="none" viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="6" width="18" height="13" rx="2"/><path d="M3 10h18"/><path d="M7 14h2"/></svg>
      Sell
    </button>
    <button class="nav-btn" data-view="inventory">
      <svg fill="none" viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 8V6a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v2"/><path d="M3 8l1 12a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2l1-12"/><path d="M3 8h18"/></svg>
      Stock
    </button>
    <button class="nav-btn" data-view="sales">
      <svg fill="none" viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18"/><path d="M7 14l4-4 3 3 5-6"/></svg>
      Sales
    </button>
    <button class="nav-btn" data-view="settings">
      <svg fill="none" viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .34 1.87l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.7 1.7 0 0 0-1.87-.34 1.7 1.7 0 0 0-1 1.55V21a2 2 0 0 1-4 0v-.09A1.7 1.7 0 0 0 9 19.4a1.7 1.7 0 0 0-1.87.34l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.7 1.7 0 0 0 4.6 15a1.7 1.7 0 0 0-1.55-1H3a2 2 0 0 1 0-4h.09A1.7 1.7 0 0 0 4.6 9a1.7 1.7 0 0 0-.34-1.87l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.7 1.7 0 0 0 9 4.6a1.7 1.7 0 0 0 1-1.55V3a2 2 0 0 1 4 0v.09a1.7 1.7 0 0 0 1 1.55 1.7 1.7 0 0 0 1.87-.34l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.7 1.7 0 0 0 19.4 9a1.7 1.7 0 0 0 1.55 1H21a2 2 0 0 1 0 4h-.09a1.7 1.7 0 0 0-1.55 1z"/></svg>
      Settings
    </button>
  </nav>

  <div id="main-col">
    <div id="topbar">
      <div>
        <h1 id="page-title">Sell</h1>
        <div class="sub" id="page-sub">Scan a barcode or search to start a sale</div>
      </div>
      <div id="topbar-right">
        <div id="clock" class="mono"></div>
        <button class="cart-btn" id="topbar-cart-btn">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/></svg>
          Cart
          <span class="cart-badge" id="cart-badge" style="display:none;">0</span>
        </button>
      </div>
    </div>
    <div id="page"></div>
  </div>
</div>

<!-- Receipt modal -->
<div class="overlay" id="receipt-overlay">
  <div class="modal" style="max-width:360px;">
    <div class="modal-head">
      <h3>Receipt</h3>
      <button class="modal-close" id="receipt-close">&times;</button>
    </div>
    <div class="modal-body" id="receipt-modal-body" style="padding:0;"></div>
    <div class="modal-foot">
      <button class="btn btn-ghost" id="receipt-print">Print</button>
      <button class="btn btn-amber" id="receipt-done">Done</button>
    </div>
  </div>
</div>

<!-- Scanner overlay (kept outside re-rendered DOM so the camera stream is never torn down) -->
<div id="scanner-overlay">
  <div class="scan-head">
    <div class="st">
      <h3 id="scan-title">Scan barcode</h3>
      <p id="scan-sub">Point the rear camera at a barcode</p>
    </div>
    <button class="scan-x" id="scan-close">&times;</button>
  </div>
  <div class="scan-stage">
    <div id="scanner-view"></div>
    <div class="reticle" id="reticle">
      <div class="corner tl"></div><div class="corner tr"></div><div class="corner bl"></div><div class="corner br"></div>
      <div class="laser-line"></div>
    </div>
    <div class="scan-success" id="scan-success">
      <div class="scan-success-check">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>
      </div>
      <div class="scan-success-label" id="scan-success-label">Added</div>
    </div>
  </div>
  <div class="scan-note" id="scan-note">Requesting camera access…</div>
  <div class="flip-row">
    <button class="flip-btn" id="flip-cam">⟲ Flip camera</button>
    <button class="torch-btn" id="torch-btn" data-on="0">💡 Flashlight</button>
  </div>
  <div class="scan-manual">
    <input id="manual-barcode" type="text" placeholder="Or type the barcode number and press Enter">
  </div>
</div>

<div id="toast-container"></div>

<script>
(function(){

"use strict";

/* ===================== Storage ===================== */
// Note: true browser localStorage isn't available inside this artifact sandbox,
// so data is kept in this app's own persistent storage, scoped privately to you
// (shared:false) — nobody else who opens this app sees or edits it.
const Storage = {
  async get(key, fallback){
    try{
      const r = await window.storage.get(key, false);
      return r && r.value !== undefined ? JSON.parse(r.value) : fallback;
    }catch(e){ return fallback; }
  },
  async set(key, value){
    try{ await window.storage.set(key, JSON.stringify(value), false); }
    catch(e){ console.error('storage set failed', key, e); showToast('Could not save — changes may be lost', 'error'); }
  }
};

/* ===================== State ===================== */
let state = {
  view: 'pos',
  products: [],
  sales: [],
  settings: { shopName: 'My Shop', currency: 'GHS', taxRate: 0, lowStock: 5 },
  cart: [],          // [{productId, qty}]
  posSearch: '',
  productFormMode: 'add',
  productFormId: null,
  invSearch: '',
  loaded: false
};

const genId = () => 'id_' + Date.now().toString(36) + Math.random().toString(36).slice(2,8);

function fmt(n){
  try{ return new Intl.NumberFormat(undefined, { style:'currency', currency: state.settings.currency || 'USD' }).format(n || 0); }
  catch(e){ return '$' + (n||0).toFixed(2); }
}

function showToast(msg, type){
  const c = document.getElementById('toast-container');
  const t = document.createElement('div');
  t.className = 'toast' + (type ? ' ' + type : '');
  t.textContent = msg;
  c.appendChild(t);
  setTimeout(()=>{ t.style.opacity='0'; t.style.transition='opacity .2s'; setTimeout(()=>t.remove(),200); }, 2400);
}

/* ===================== Init / seed ===================== */
async function init(){
  const [products, sales, settings] = await Promise.all([
    Storage.get('products', null),
    Storage.get('sales', []),
    Storage.get('settings', null)
  ]);

  state.products = products || [];

  state.sales = sales || [];
  state.settings = settings || state.settings;
  state.loaded = true;

  bindStaticEvents();
  startClock();
  render();
}

/* ===================== Persistence helpers ===================== */
async function saveProducts(){ await Storage.set('products', state.products); }
async function saveSales(){ await Storage.set('sales', state.sales); }
async function saveSettings(){ await Storage.set('settings', state.settings); }

/* ===================== Clock ===================== */
function startClock(){
  const el = document.getElementById('clock');
  const tick = () => { el.textContent = new Date().toLocaleString(undefined, { weekday:'short', hour:'2-digit', minute:'2-digit', month:'short', day:'numeric' }); };
  tick(); setInterval(tick, 30000);
}

/* ===================== Nav ===================== */
function bindStaticEvents(){
  document.querySelectorAll('.nav-btn').forEach(btn=>{
    btn.addEventListener('click', ()=>{ state.view = btn.dataset.view; render(); });
  });
  document.getElementById('topbar-cart-btn').addEventListener('click', ()=>{ state.view = 'checkout'; render(); });

  // Receipt modal
  document.getElementById('receipt-close').addEventListener('click', closeReceipt);
  document.getElementById('receipt-done').addEventListener('click', closeReceipt);
  document.getElementById('receipt-print').addEventListener('click', ()=>{ if (currentReceiptId) printReceipt(currentReceiptId); });

  // Scanner modal
  document.getElementById('scan-close').addEventListener('click', closeScanner);
  document.getElementById('flip-cam').addEventListener('click', flipCamera);
  document.getElementById('torch-btn').addEventListener('click', toggleTorch);
  document.getElementById('manual-barcode').addEventListener('keydown', (e)=>{
    if (e.key === 'Enter'){
      const v = e.target.value.trim();
      if (v && scannerCtx.onDetect){ scannerCtx.onDetect(v); e.target.value=''; }
    }
  });
}

/* ===================== Render router ===================== */
function render(){
  document.querySelectorAll('.nav-btn').forEach(b => b.classList.toggle('active',
    b.dataset.view === state.view ||
    (b.dataset.view==='pos' && state.view==='checkout') ||
    (b.dataset.view==='inventory' && state.view==='product-form')
  ));
  const titles = {
    pos:['Sell','Scan a barcode or search to start a sale'],
    checkout:['Checkout','Review the cart and take payment'],
    inventory:['Stock','Manage products, prices and barcodes'],
    'product-form':[state.productFormMode==='edit'?'Edit product':'Add product','Fill in the details below'],
    sales:['Sales','Completed transactions'],
    settings:['Settings','Shop preferences']
  };
  document.getElementById('page-title').textContent = titles[state.view][0];
  document.getElementById('page-sub').textContent = titles[state.view][1];

  const page = document.getElementById('page');
  if (state.view === 'pos') page.innerHTML = renderPOS();
  else if (state.view === 'checkout') page.innerHTML = renderCheckout();
  else if (state.view === 'inventory') page.innerHTML = renderInventory();
  else if (state.view === 'product-form') page.innerHTML = renderProductForm();
  else if (state.view === 'sales') page.innerHTML = renderSales();
  else page.innerHTML = renderSettings();

  const itemCount = state.cart.reduce((a,c)=>a+c.qty,0);
  const badge = document.getElementById('cart-badge');
  badge.textContent = itemCount;
  badge.style.display = itemCount ? 'flex' : 'none';

  bindPageEvents();
}

/* ===================== POS view ===================== */
function renderPOS(){
  const q = state.posSearch.trim().toLowerCase();
  const filtered = state.products.filter(p =>
    !q || p.name.toLowerCase().includes(q) || (p.barcode||'').includes(q) || (p.category||'').toLowerCase().includes(q)
  );

  const cards = filtered.map(p => `
    <button class="p-card" data-add="${p.id}" ${p.stock<=0?'disabled':''}>
      <div class="p-avatar">${escapeHtml(p.name.slice(0,2).toUpperCase())}</div>
      <div class="p-name">${escapeHtml(p.name)}</div>
      <div class="p-meta">
        <span class="p-price mono">${fmt(p.price)}</span>
        <span class="p-stock ${p.stock<=state.settings.lowStock?'low':''}">${p.stock<=0?'Out':p.stock+' left'}</span>
      </div>
    </button>
  `).join('');

  const itemCount = state.cart.reduce((a,c)=>a+c.qty,0);
  const total = cartSubtotal() * (1 + state.settings.taxRate/100);

  return `
  <div class="pos-left" style="height:100%;display:flex;flex-direction:column;">
    <div class="scan-cta">
      <div class="txt">
        <h2>Scan to sell</h2>
        <p>Use your camera as a barcode scanner — items are added instantly</p>
      </div>
      <button class="btn btn-amber" id="btn-scan-sale">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="7" width="18" height="10" rx="1"/><path d="M7 7v10M11 7v10M17 7v10"/></svg>
        Scan barcode
      </button>
    </div>
    <div class="search-row" style="margin-top:16px;">
      <input id="pos-search" type="text" placeholder="Search products by name, category or barcode…" value="${escapeAttr(state.posSearch)}">
    </div>
    <div style="margin-top:16px;flex:1;overflow-y:auto;">
      ${filtered.length ? `<div class="product-grid">${cards}</div>` : (state.products.length ? `<div class="empty-state"><svg fill="none" viewBox="0 0 24 24" stroke-width="1.5"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg><p>No products match “${escapeHtml(state.posSearch)}”.</p></div>` : `<div class="empty-state"><svg fill="none" viewBox="0 0 24 24" stroke-width="1.5"><path d="M21 8V6a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v2"/><path d="M3 8l1 12a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2l1-12"/><path d="M3 8h18"/></svg><p>No products yet. Add your first product in Stock to start selling.</p></div>`)}
    </div>
    ${itemCount ? `
    <div class="cart-float-wrap">
      <div class="cart-float">
        <div class="cf-info"><span>${itemCount} item(s) in cart</span><span>${fmt(total)}</span></div>
        <button class="btn btn-amber" id="btn-view-cart">View cart →</button>
      </div>
    </div>` : ''}
  </div>`;
}

function renderCheckout(){
  const cartHtml = state.cart.length ? state.cart.map(ci=>{
    const p = state.products.find(x=>x.id===ci.productId);
    if (!p) return '';
    return `
      <div class="r-item">
        <div class="r-name">${escapeHtml(p.name)}<small>${fmt(p.price)} each</small></div>
        <div class="qty-ctl">
          <button data-qty="-1" data-id="${p.id}">−</button>
          <span>${ci.qty}</span>
          <button data-qty="1" data-id="${p.id}">+</button>
        </div>
        <div class="r-line-total">${fmt(p.price*ci.qty)}</div>
        <button class="r-remove" data-remove="${p.id}">&times;</button>
      </div>`;
  }).join('') : `<div class="empty-state" style="padding:30px 10px;">
      <svg fill="none" viewBox="0 0 24 24" stroke-width="1.5"><rect x="3" y="6" width="18" height="13" rx="2"/><path d="M3 10h18"/></svg>
      <p>Your cart is empty. Go back to the shop to scan or add products.</p>
    </div>`;

  const subtotal = cartSubtotal();
  const tax = subtotal * (state.settings.taxRate/100);
  const total = subtotal + tax;

  return `
  <div class="checkout-wrap">
    <button class="checkout-back" id="btn-back-to-shop">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M19 12H5"/><path d="M12 19l-7-7 7-7"/></svg>
      Back to shop
    </button>
    <div class="receipt" style="flex:1;">
      <div class="receipt-top"></div>
      <div class="receipt-head">
        <h3>${escapeHtml(state.settings.shopName || 'My Shop')}</h3>
        <div class="rmeta">${new Date().toLocaleDateString()} · ${state.cart.reduce((a,c)=>a+c.qty,0)} item(s)</div>
      </div>
      <div class="receipt-body">${cartHtml}</div>
      <div class="receipt-tot">
        <div class="tot-row"><span>Subtotal</span><span>${fmt(subtotal)}</span></div>
        <div class="tot-row"><span>Tax (${state.settings.taxRate||0}%)</span><span>${fmt(tax)}</span></div>
        <div class="tot-row grand"><span>Total</span><span>${fmt(total)}</span></div>
        <button class="btn btn-amber charge-btn" id="btn-charge" ${state.cart.length?'':'disabled'}>Charge ${fmt(total)}</button>
        ${state.cart.length ? `<button class="btn btn-ghost" id="btn-clear-cart" style="width:100%;margin-top:8px;">Clear sale</button>` : ''}
      </div>
    </div>
  </div>`;
}

function cartSubtotal(){
  return state.cart.reduce((sum, ci)=>{
    const p = state.products.find(x=>x.id===ci.productId);
    return sum + (p ? p.price*ci.qty : 0);
  },0);
}

function addToCart(productId){
  const p = state.products.find(x=>x.id===productId);
  if (!p) return;
  const inCart = state.cart.find(c=>c.productId===productId);
  const currentQty = inCart ? inCart.qty : 0;
  if (currentQty + 1 > p.stock){ showToast(`Only ${p.stock} in stock for ${p.name}`, 'error'); return; }
  if (inCart) inCart.qty += 1;
  else state.cart.push({ productId, qty:1 });
  showToast(`Added ${p.name}`, 'success');
  render();
}

/* ===================== Inventory view ===================== */
function renderInventory(){
  const q = state.invSearch.trim().toLowerCase();
  const list = state.products.filter(p => !q || p.name.toLowerCase().includes(q) || (p.barcode||'').includes(q));
  const rows = list.map(p => `
    <tr class="${p.stock<=state.settings.lowStock?'low-row':''}">
      <td data-label="Product"><strong>${escapeHtml(p.name)}</strong></td>
      <td data-label="Category"><span class="tag">${escapeHtml(p.category||'Uncategorized')}</span></td>
      <td data-label="Price" class="mono">${fmt(p.price)}</td>
      <td data-label="Stock" class="mono">${p.stock}${p.stock<=state.settings.lowStock?' <span class="tag" style="background:var(--red-bg);color:#C81E1E;">Low</span>':''}</td>
      <td data-label="Barcode" class="mono">${p.barcode ? escapeHtml(p.barcode) : '<span style="color:var(--text-2);">— none —</span>'}</td>
      <td class="row-actions-cell">
        <div class="row-actions">
          <button class="icon-btn" data-edit="${p.id}" title="Edit"><svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg></button>
          <button class="icon-btn" data-del="${p.id}" title="Delete"><svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path d="M3 6h18"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/></svg></button>
        </div>
      </td>
    </tr>`).join('');

  return `
    <div class="toolbar">
      <input id="inv-search" class="toolbar-search" type="text" placeholder="Search by name or barcode…" value="${escapeAttr(state.invSearch)}">
      <button class="btn btn-amber" id="btn-add-product">+ Add product</button>
    </div>
    ${list.length ? `
    <table>
      <thead><tr><th>Product</th><th>Category</th><th>Price</th><th>Stock</th><th>Barcode</th><th></th></tr></thead>
      <tbody>${rows}</tbody>
    </table>` : `<div class="empty-state"><svg fill="none" viewBox="0 0 24 24" stroke-width="1.5"><path d="M21 8V6a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v2"/><path d="M3 8l1 12a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2l1-12"/><path d="M3 8h18"/></svg><p>No products found. Add your first product to get started.</p></div>`}
  `;
}

/* ===================== Add / edit product screen ===================== */
function renderProductForm(){
  const p = state.productFormMode === 'edit' ? state.products.find(x=>x.id===state.productFormId) : null;
  return `
  <div class="checkout-wrap">
    <button class="checkout-back" id="btn-back-to-stock">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M19 12H5"/><path d="M12 19l-7-7 7-7"/></svg>
      Back to stock
    </button>
    <div style="background:var(--panel);border-radius:var(--radius);box-shadow:var(--shadow);padding:22px;display:flex;flex-direction:column;gap:16px;">
      <div class="field" id="f-name">
        <label>Product name *</label>
        <input id="in-name" type="text" placeholder="e.g. Colombian Coffee 250g" maxlength="80" value="${p?escapeAttr(p.name):''}">
        <div class="err">Enter a product name.</div>
      </div>
      <div class="two-col">
        <div class="field" id="f-price">
          <label>Price (₵) *</label>
          <input id="in-price" type="number" min="0" step="0.01" placeholder="0.00" value="${p?p.price:''}">
          <div class="err">Enter a valid price.</div>
        </div>
        <div class="field" id="f-stock">
          <label>Stock on hand *</label>
          <input id="in-stock" type="number" min="0" step="1" placeholder="0" value="${p?p.stock:''}">
          <div class="err">Enter a valid quantity.</div>
        </div>
      </div>
      <div class="field">
        <label>Category</label>
        <input id="in-category" type="text" placeholder="e.g. Beverages" maxlength="40" value="${p?escapeAttr(p.category||''):''}">
      </div>
      <div class="field" id="f-barcode">
        <label>Barcode <span style="font-weight:400;color:var(--text-2);">(optional — scan or type)</span></label>
        <div class="barcode-field">
          <input id="in-barcode" type="text" placeholder="No barcode" maxlength="40" value="${p?escapeAttr(p.barcode||''):''}">
          <button class="btn btn-dark btn-sm" id="btn-scan-for-product" type="button">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="7" width="18" height="10" rx="1"/><path d="M7 7v10M11 7v10M17 7v10"/></svg>
            Scan
          </button>
        </div>
        <div class="err">That barcode is already used by another product.</div>
      </div>
      <div style="display:flex;gap:10px;justify-content:flex-end;padding-top:6px;border-top:1px solid var(--line);margin-top:2px;padding-top:16px;">

}

function renderSales(){

  const todayTotal = todaySales.reduce((a,s)=>a+s.total,0);

/* ===================== Page event binding ===================== */
function bindPageEvents(){
  if (state.view === 'pos'){
    document.getElementById('btn-scan-sale').addEventListener('click', ()=>{
      openScanner({
        title:'Scan to sell', sub:'Keep scanning to add multiple items', continuous:true,
        onDetect: handleSaleScan
      });
    });
    const search = document.getElementById('pos-search');
    search.addEventListener('input', e=>{ state.posSearch = e.target.value; renderKeepFocus('pos-search'); });
    document.querySelectorAll('[data-add]').forEach(b=>b.addEventListener('click', ()=> addToCart(b.dataset.add)));
    const viewCartBtn = document.getElementById('btn-view-cart');
    if (viewCartBtn) viewCartBtn.addEventListener('click', ()=>{ state.view='checkout'; render(); });
  }

  if (state.view === 'checkout'){
    document.getElementById('btn-back-to-shop').addEventListener('click', ()=>{ state.view='pos'; render(); });
    document.querySelectorAll('[data-qty]').forEach(b=>b.addEventListener('click', ()=> adjustQty(b.dataset.id, parseInt(b.dataset.qty,10))));
    document.querySelectorAll('[data-remove]').forEach(b=>b.addEventListener('click', ()=>{ state.cart = state.cart.filter(c=>c.productId!==b.dataset.remove); render(); }));
    const chargeBtn = document.getElementById('btn-charge');
    if (chargeBtn) chargeBtn.addEventListener('click', checkout);
    const clearBtn = document.getElementById('btn-clear-cart');
    if (clearBtn) clearBtn.addEventListener('click', ()=>{ state.cart=[]; render(); });
  }

  if (state.view === 'inventory'){
    document.getElementById('btn-add-product').addEventListener('click', ()=> goToProductForm(null));
    const search = document.getElementById('inv-search');
    search.addEventListener('input', e=>{ state.invSearch = e.target.value; renderKeepFocus('inv-search'); });
    document.querySelectorAll('[data-edit]').forEach(b=>b.addEventListener('click', ()=> goToProductForm(b.dataset.edit)));
    document.querySelectorAll('[data-del]').forEach(b=>b.addEventListener('click', ()=> deleteProduct(b.dataset.del)));
  }

  if (state.view === 'product-form'){
    document.getElementById('btn-back-to-stock').addEventListener('click', ()=>{ state.view='inventory'; render(); });
    document.getElementById('btn-cancel-product').addEventListener('click', ()=>{ state.view='inventory'; render(); });
    document.getElementById('btn-save-product').addEventListener('click', saveProductForm);
    document.getElementById('btn-scan-for-product').addEventListener('click', ()=>{
      openScanner({
        title:'Scan product barcode',
        sub:'Line the barcode up inside the frame',
        continuous:true, // we close it ourselves below, once the checkmark has been shown
        onDetect:(code)=>{
          if (scanLocked) return;
          scanLocked = true;
          document.getElementById('in-barcode').value = code;
          showScanSuccessMark('Captured');
          const session = scanSessionId;
          setTimeout(()=>{
            if (session !== scanSessionId) return;
            closeScanner();
            showToast('Barcode captured');
          }, 900);
        }
      });
    });
  }

  if (state.view === 'sales'){
    document.querySelectorAll('[data-receipt]').forEach(tr=>tr.addEventListener('click', ()=> openReceipt(tr.dataset.receipt)));
  }

  if (state.view === 'settings'){
    document.getElementById('btn-save-settings').addEventListener('click', async ()=>{
      state.settings.shopName = document.getElementById('set-shop').value.trim() || 'My Shop';
      state.settings.currency = document.getElementById('set-currency').value;
      state.settings.taxRate = parseFloat(document.getElementById('set-tax').value) || 0;
      state.settings.lowStock = parseInt(document.getElementById('set-lowstock').value,10) || 0;
      await saveSettings();
      showToast('Settings saved', 'success');
      render();
    });
    document.getElementById('btn-reset-data').addEventListener('click', async ()=>{
      if (!confirm('This will permanently delete all products and sales. Continue?')) return;
      state.products = []; state.cart = []; state.sales = [];
      await Promise.all([saveProducts(), saveSales()]);
      showToast('All data cleared');
      state.view='inventory'; render();
    });
  }
}

// Re-render while preserving focus + caret in a live search input
function renderKeepFocus(id){
  const el = document.getElementById(id);
  const pos = el ? el.selectionStart : null;
  render();
  const el2 = document.getElementById(id);
  if (el2){ el2.focus(); if (pos!==null) el2.setSelectionRange(pos,pos); }
}

function adjustQty(productId, delta){
  const ci = state.cart.find(c=>c.productId===productId);
  const p = state.products.find(x=>x.id===productId);
  if (!ci || !p) return;
  const next = ci.qty + delta;
  if (next <= 0){ state.cart = state.cart.filter(c=>c.productId!==productId); }
  else if (next > p.stock){ showToast(`Only ${p.stock} in stock`, 'error'); return; }
  else { ci.qty = next; }
  render();
}

/* ===================== Sale scan handling (continuous) ===================== */
const SCAN_CONFIRM_MS = 1600; // how long the checkmark stays up before the camera resumes
let lastScan = { code:null, time:0 };
function handleSaleScan(code){
  if (scanLocked) return; // a successful scan is already being confirmed — ignore everything else until it clears
  const now = Date.now();
  if (code === lastScan.code && now - lastScan.time < 1400) return;
  lastScan = { code, time: now };
  const p = state.products.find(x=>x.barcode && barcodesMatch(x.barcode, code));
  if (!p){
    flashScanNote(`No product matches "${code}"`, true);
    return;
  }
  const inCart = state.cart.find(c=>c.productId===p.id);
  const currentQty = inCart ? inCart.qty : 0;
  if (currentQty + 1 > p.stock){
    flashScanNote(`${p.name} is out of stock`, true);
    return;
  }
  if (inCart) inCart.qty += 1; else state.cart.push({ productId:p.id, qty:1 });
  flashScanNote(`Added ${p.name} · ${fmt(p.price)}`, false);
  if (state.view === 'pos') render();

  // Scanning the same product again right after is treated as "I'm done" and
  // returns to Sell; otherwise the camera just resumes for the next product.
  const scanningSameProductAgain = (p.id === lastAddedProductId);
  lastAddedProductId = p.id;

  // Lock out further reads so the same barcode staying in frame — or a second
  // accidental scan — can never be recorded twice, and show a checkmark to
  // confirm the add.
  scanLocked = true;
  showScanSuccessMark(p.name);
  const session = scanSessionId;
  setTimeout(()=>{
    if (session !== scanSessionId) return; // scanner was closed/reopened in the meantime
    if (scanningSameProductAgain){
      closeScanner();
      state.view = 'pos';
      render();
      return;
    }
    hideScanSuccessMark();
    scanLocked = false;
    document.getElementById('scan-note').textContent = 'Scanning… hold steady over a barcode';
    document.getElementById('scan-note').style.color = '#C8CCD8';
  }, SCAN_CONFIRM_MS);
}

function flashScanNote(msg, isError){
  const note = document.getElementById('scan-note');
  note.textContent = msg;
  note.style.color = isError ? '#FF8080' : '#8CF0C0';
  // Give a clear, unmissable signal for every scan (continuous mode has no other
  // pause to confirm a scan landed) so cashiers aren't left wondering whether an
  // item registered — the single-shot "add product" scan doesn't need this because
  // it closes the scanner immediately on success.
  const reticle = document.getElementById('reticle');
  if (reticle){
    reticle.classList.remove('hit','miss');
    void reticle.offsetWidth;
    reticle.classList.add(isError ? 'miss' : 'hit');
    setTimeout(()=>reticle.classList.remove('hit','miss'), 450);
  }
  if (navigator.vibrate) navigator.vibrate(isError ? [40,50,40] : 30);
}

/* ===================== Checkout ===================== */
async function checkout(){
  if (!state.cart.length) return;
  const items = state.cart.map(ci=>{
    const p = state.products.find(x=>x.id===ci.productId);
    return { productId:p.id, name:p.name, price:p.price, qty:ci.qty };
  });
  const subtotal = cartSubtotal();
  const tax = subtotal * (state.settings.taxRate/100);
  const total = subtotal + tax;
  const sale = { id: genId(), timestamp: Date.now(), items, subtotal, tax, total };

  // decrement stock
  items.forEach(it=>{
    const p = state.products.find(x=>x.id===it.productId);
    if (p) p.stock = Math.max(0, p.stock - it.qty);
  });
  state.sales.push(sale);
  state.cart = [];
  state.view = 'pos';

  await Promise.all([saveProducts(), saveSales()]);
  render();
  openReceipt(sale.id);
  showToast('Sale completed', 'success');
}

/* ===================== Add / edit product screen logic ===================== */
function goToProductForm(id){
  state.productFormMode = id ? 'edit' : 'add';
  state.productFormId = id;
  state.view = 'product-form';
  render();
}

async function saveProductForm(){
  const name = document.getElementById('in-name').value.trim();
  const price = parseFloat(document.getElementById('in-price').value);
  const stock = parseInt(document.getElementById('in-stock').value,10);
  const category = document.getElementById('in-category').value.trim();
  const barcode = document.getElementById('in-barcode').value.trim();
  const editingId = state.productFormMode === 'edit' ? state.productFormId : null;

  let hasErr = false;
  const setErr = (fid, bad) => { document.getElementById(fid).classList.toggle('has-err', bad); if (bad) hasErr = true; };
  setErr('f-name', !name);
  setErr('f-price', !(price >= 0));
  setErr('f-stock', !(Number.isInteger(stock) && stock >= 0));
  const dupe = barcode && state.products.some(p => barcodesMatch(p.barcode, barcode) && p.id !== editingId);
  setErr('f-barcode', dupe);
  if (hasErr) return;

  if (editingId){
    const p = state.products.find(x=>x.id===editingId);
    Object.assign(p, { name, price, stock, category, barcode });
  } else {
    state.products.push({ id: genId(), name, price, stock, category, barcode, createdAt: Date.now() });
  }
  await saveProducts();
  showToast('Product saved', 'success');
  state.view = 'inventory';
  render();
}

async function deleteProduct(id){
  const p = state.products.find(x=>x.id===id);
  if (!p) return;
  if (!confirm(`Delete "${p.name}"? This can't be undone.`)) return;
  state.products = state.products.filter(x=>x.id!==id);
  state.cart = state.cart.filter(c=>c.productId!==id);
  await saveProducts();
  showToast('Product deleted');
  render();
}

/* ===================== Scanner (camera) — persistent DOM, never re-rendered ===================== */
let html5QrCode = null;
let scannerCtx = { onDetect:null, continuous:false };
let currentFacingMode = 'environment';

// A successful scan locks out any further reads (same barcode staying in frame,
// or a different item bumped into view) until the confirmation finishes, so one
// physical scan is never recorded twice. scanSessionId invalidates any pending
// confirmation timer if the scanner gets closed/reopened before it fires.
let scanLocked = false;
let scanSessionId = 0;
let lastAddedProductId = null; // scanning this same product again is treated as "done" and returns home

function showScanSuccessMark(label){
  const el = document.getElementById('scan-success');
  const lbl = document.getElementById('scan-success-label');
  if (lbl) lbl.textContent = label || 'Added';
  if (el) el.classList.add('show');
}
function hideScanSuccessMark(){
  const el = document.getElementById('scan-success');
  if (el) el.classList.remove('show');
}

function openScanner(opts){
  scannerCtx = opts;
  scanSessionId++;
  scanLocked = false;
  lastAddedProductId = null;
  hideScanSuccessMark();
  document.getElementById('scan-title').textContent = opts.title || 'Scan barcode';
  document.getElementById('scan-sub').textContent = opts.sub || '';
  document.getElementById('scan-note').textContent = 'Requesting camera access…';
  document.getElementById('scan-note').style.color = '#C8CCD8';
  document.getElementById('manual-barcode').value = '';
  document.getElementById('scanner-overlay').classList.add('open');
  startCamera();
}

function startCamera(){
  if (typeof Html5Qrcode === 'undefined'){
    document.getElementById('scan-note').textContent = 'Camera library failed to load — enter the barcode manually below.';
    document.getElementById('scan-note').style.color = '#FF8080';
    return;
  }
  // Restrict decoding to the formats actually used at retail. The default config tries
  // every format the library knows (QR, Aztec, PDF417, Data Matrix, etc.), which slows
  // frame processing down and made scanning noticeably less reliable during a live,
  // handheld, continuous sell-side scan than the single, careful, well-lit scan used
  // when adding a product.
  const retailFormats = (typeof Html5QrcodeSupportedFormats !== 'undefined') ? [
    Html5QrcodeSupportedFormats.EAN_13,
    Html5QrcodeSupportedFormats.EAN_8,
    Html5QrcodeSupportedFormats.UPC_A,
    Html5QrcodeSupportedFormats.UPC_E,
    Html5QrcodeSupportedFormats.UPC_EAN_EXTENSION,
    Html5QrcodeSupportedFormats.CODE_128,
    Html5QrcodeSupportedFormats.CODE_39,
    Html5QrcodeSupportedFormats.CODE_93,
    Html5QrcodeSupportedFormats.ITF,
    Html5QrcodeSupportedFormats.CODABAR,
    Html5QrcodeSupportedFormats.QR_CODE
  ] : undefined;

  html5QrCode = new Html5Qrcode('scanner-view', {
    verbose:false,
    formatsToSupport: retailFormats,
    // Uses the phone/browser's native barcode detector when available (most current
    // Android Chrome), which is faster and far more reliable at reading a barcode
    // while it's moving under a handheld phone than the pure-JS decoder fallback.
    experimentalFeatures: { useBarCodeDetectorIfSupported: true }
  });
  html5QrCode.start(
    { facingMode: currentFacingMode },
    { fps: 15, qrbox: { width: 300, height: 160 }, aspectRatio: 1.7777778 },
    (decodedText) => {
      if (scannerCtx.onDetect) scannerCtx.onDetect(decodedText);
      if (!scannerCtx.continuous) closeScanner();
    },
    () => { /* per-frame miss — ignore */ }
  ).then(()=>{
    document.getElementById('scan-note').textContent = scannerCtx.continuous ? 'Scanning… hold steady over a barcode' : 'Align the barcode inside the frame';
    updateTorchAvailability();
  }).catch(()=>{
    document.getElementById('scan-note').textContent = 'Camera unavailable — enter the barcode manually below.';
    document.getElementById('scan-note').style.color = '#FF8080';
  });
}

function stopCamera(){
  if (html5QrCode){
    const inst = html5QrCode;
    html5QrCode = null;
    inst.stop().then(()=>inst.clear()).catch(()=>{});
  }
  const torchBtn = document.getElementById('torch-btn');
  if (torchBtn){ torchBtn.style.display = 'none'; torchBtn.dataset.on = '0'; torchBtn.classList.remove('active'); }
}

function closeScanner(){
  scanSessionId++;
  scanLocked = false;
  hideScanSuccessMark();
  stopCamera();
  document.getElementById('scanner-overlay').classList.remove('open');
  scannerCtx = { onDetect:null, continuous:false };
}

function flipCamera(){
  currentFacingMode = currentFacingMode === 'environment' ? 'user' : 'environment';
  stopCamera();
  setTimeout(startCamera, 250);
}

// Shows the flashlight toggle only on devices/cameras that actually support it
// (mainly rear cameras on Android) — a common reason sell-side scans miss is a
// dim stockroom or counter, which a static "add a product" scan rarely hits.
function updateTorchAvailability(){
  const btn = document.getElementById('torch-btn');
  if (!btn) return;
  try{
    const caps = html5QrCode && html5QrCode.getRunningTrackCapabilities ? html5QrCode.getRunningTrackCapabilities() : null;
    btn.style.display = (caps && caps.torch) ? 'inline-flex' : 'none';
    btn.dataset.on = '0';
    btn.classList.remove('active');
  }catch(e){
    btn.style.display = 'none';
  }
}

function toggleTorch(){
  if (!html5QrCode || !html5QrCode.applyVideoConstraints) return;
  const btn = document.getElementById('torch-btn');
  const turnOn = btn.dataset.on !== '1';
  html5QrCode.applyVideoConstraints({ torch: turnOn, advanced:[{ torch: turnOn }] }).then(()=>{
    btn.dataset.on = turnOn ? '1' : '0';
    btn.classList.toggle('active', turnOn);
  }).catch(()=>{ showToast('Flashlight unavailable on this camera', 'error'); });
}

/* ===================== Utils ===================== */
function escapeHtml(str){
  return String(str==null?'':str).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}
function escapeAttr(str){ return escapeHtml(str); }

// Barcode matching used to be a plain === on raw scanner output. That's fragile:
// a camera scan can pick up stray whitespace, and — much more commonly — the same
// physical barcode gets reported as a 12-digit UPC-A by one read and a 13-digit
// EAN-13 (UPC-A with a leading 0) by another, depending on the decoder/camera. A
// product saved with one form and scanned back at the register with the other
// form used to silently fail to match. Normalize + compare against both variants.
function normalizeBarcode(code){
  return String(code == null ? '' : code).trim().replace(/\s+/g, '');
}
function barcodeVariants(code){
  const n = normalizeBarcode(code);
  const variants = new Set([n]);
  if (/^\d{12}$/.test(n)) variants.add('0' + n);          // UPC-A -> EAN-13
  if (/^0\d{12}$/.test(n)) variants.add(n.slice(1));       // EAN-13 -> UPC-A
  return variants;
}
function barcodesMatch(a, b){
  if (!a || !b) return false;
  const va = barcodeVariants(a);
  for (const v of barcodeVariants(b)) if (va.has(v)) return true;
  return false;
}

init();
})();
